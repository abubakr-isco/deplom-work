<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Товар Sandbox Shop: описание, цена и отзывы." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/css/main.css" />
    <title>Товар — Sandbox Shop</title>
  </head>
  <body data-page="product">
    <!-- @include partials/header.html -->

    <main id="main" class="site-main">
      <div class="container product-page">
        <div data-view="loading">
          <div class="state state--loading" role="status">
            <span class="spinner" aria-hidden="true"></span>
            <span>Загружаем товар…</span>
          </div>
        </div>

        <div data-view="error" hidden></div>

        <div data-view="content" hidden>
          <div class="product">
            <div class="product__media media">
              <img alt="" fetchpriority="high" data-product-image />
            </div>
            <div class="product__info">
              <p class="product__category" data-product-category hidden><a href=""></a></p>
              <h1 class="product__title" data-product-title></h1>
              <p class="product__price" data-product-price></p>
              <p class="product__description" data-product-description hidden></p>

              <div class="product__buy">
                <div class="stepper" role="group" aria-label="Количество">
                  <button type="button" class="stepper__btn" data-qty="-1" aria-label="Уменьшить количество">
                    <svg class="icon" width="24" height="24" aria-hidden="true"><use href="/icons.svg#minus"></use></svg>
                  </button>
                  <output class="stepper__value" data-qty-value aria-live="polite">1</output>
                  <button type="button" class="stepper__btn" data-qty="1" aria-label="Увеличить количество">
                    <svg class="icon" width="24" height="24" aria-hidden="true"><use href="/icons.svg#plus"></use></svg>
                  </button>
                </div>
                <button type="button" class="btn product__add" data-add>Add to cart</button>
              </div>
              <p class="product__note" data-cart-note></p>
              <p class="product__stats" data-product-stats></p>
            </div>
          </div>

          <section class="reviews" aria-labelledby="reviews-title">
            <div class="reviews__head">
              <h2 class="reviews__title" id="reviews-title">All Reviews <span class="reviews__count" data-review-count></span></h2>
              <button type="button" class="btn reviews__write" data-write>Write a Review</button>
            </div>
            <p class="reviews__hint" data-review-hint hidden></p>
            <div class="reviews__grid" data-reviews></div>
            <div class="state state--empty" data-reviews-empty hidden>
              <p>Отзывов пока нет — станьте первым.</p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- @include partials/footer.html -->
    <!-- @include partials/templates.html -->

    <dialog class="modal modal--form" id="comment-dialog" aria-labelledby="comment-title">
      <button type="button" class="modal__close" data-dialog-close aria-label="Закрыть">
        <svg class="icon" width="24" height="24" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
      </button>

      <form class="comment-form" data-step="form" novalidate>
        <h2 class="modal__title" id="comment-title">Оставить отзыв</h2>
        <div class="field">
          <label class="field__label" for="comment-text">Текст</label>
          <textarea class="field__input field__input--area" id="comment-text" name="text" rows="5" minlength="2" maxlength="300"
            placeholder="Ваш отзыв" required aria-describedby="comment-counter comment-error"></textarea>
          <div class="field__meta">
            <p class="field__error" id="comment-error" hidden></p>
            <span class="field__counter" id="comment-counter">0 / 300</span>
          </div>
        </div>
        <button type="submit" class="btn btn--square btn--block">Отправить</button>
      </form>

      <div data-step="thanks" hidden>
        <h2 class="modal__title" id="comment-thanks-title">Спасибо!</h2>
        <p class="modal__text">Ваш отзыв опубликован</p>
        <div class="modal__actions">
          <button type="button" class="btn btn--square btn--block btn--large" data-dialog-close>Хорошо</button>
        </div>
      </div>
    </dialog>

    <template id="tpl-review">
      <article class="review-card">
        <header class="review-card__head">
          <h3 class="review-card__author"></h3>
          <svg class="icon review-card__badge" width="20" height="20" aria-hidden="true"><use href="/icons.svg#verified"></use></svg>
          <span class="review-card__you" hidden>Ваш отзыв</span>
        </header>
        <p class="review-card__text"></p>
        <footer class="review-card__foot">
          <time class="review-card__date"></time>
          <button type="button" class="review-card__delete" data-delete-comment hidden>
            <svg class="icon" width="18" height="18" aria-hidden="true"><use href="/icons.svg#trash"></use></svg>
            <span>Удалить</span>
          </button>
        </footer>
      </article>
    </template>

    <script type="module" src="/js/pages/product.js"></script>
  </body>
</html>
