<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Регистрация в Sandbox Shop." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/css/main.css" />
    <title>Регистрация — Sandbox Shop</title>
  </head>
  <body data-page="register">
    <!-- @include partials/header.html -->

    <main id="main" class="site-main">
      <div class="container auth">
        <div data-logged-in hidden>
          <h1 class="page-title">Вы уже вошли</h1>
          <p class="auth__switch">Перейдите в <a href="/profile.html">профиль</a> или выйдите там, чтобы создать другой аккаунт.</p>
        </div>

        <div data-guest-view>
          <h1 class="page-title">Register</h1>

          <form class="auth__form" novalidate>
            <p class="alert" data-form-alert role="alert" tabindex="-1" hidden></p>

            <div class="field">
              <label class="field__label" for="field-name">Name</label>
              <input class="field__input" id="field-name" name="name" type="text" placeholder="Alex" autocomplete="given-name"
                required aria-describedby="field-name-error" />
              <p class="field__error" id="field-name-error" hidden></p>
            </div>

            <div class="field">
              <label class="field__label" for="field-surname">Surname</label>
              <input class="field__input" id="field-surname" name="surname" type="text" placeholder="Adams" autocomplete="family-name"
                required aria-describedby="field-surname-error" />
              <p class="field__error" id="field-surname-error" hidden></p>
            </div>

            <div class="field">
              <label class="field__label" for="field-email">Email</label>
              <input class="field__input" id="field-email" name="email" type="email" placeholder="Email" autocomplete="email"
                inputmode="email" required aria-describedby="field-email-error" />
              <p class="field__error" id="field-email-error" hidden></p>
            </div>

            <div class="field">
              <label class="field__label" for="field-phone">Phone</label>
              <input class="field__input" id="field-phone" name="phone" type="tel" placeholder="+998" autocomplete="tel"
                inputmode="tel" required aria-describedby="field-phone-error" />
              <p class="field__error" id="field-phone-error" hidden></p>
            </div>

            <div class="field">
              <label class="field__label" for="field-password">Password</label>
              <input class="field__input" id="field-password" name="password" type="password" placeholder="Your password"
                autocomplete="new-password" required aria-describedby="field-password-error field-password-hint" />
              <p class="field__hint visually-hidden" id="field-password-hint">Не используйте пароль от почты, банка или соцсетей.</p>
              <p class="field__error" id="field-password-error" hidden></p>
            </div>

            <div class="field">
              <label class="field__label" for="field-password2">Repeat your password</label>
              <input class="field__input" id="field-password2" name="password2" type="password" placeholder="Your password"
                autocomplete="new-password" required aria-describedby="field-password2-error" />
              <p class="field__error" id="field-password2-error" hidden></p>
            </div>

            <button type="submit" class="btn btn--square btn--block btn--form">Register</button>
          </form>

          <p class="auth__switch">Уже есть аккаунт? <a href="/login.html" data-switch-link>Войти</a></p>
          <details class="auth__help">
            <summary>Об учебном аккаунте</summary>
            <p>Не используйте настоящий пароль. Данные автоматически удаляются через 45 дней.</p>
          </details>
        </div>
      </div>
    </main>

    <!-- @include partials/footer.html -->
    <!-- @include partials/templates.html -->

    <script type="module" src="/js/pages/register.js"></script>
  </body>
</html>
